name: Windows

# temporary debug workflow for the json_view MSVC x86/x64 Release crash; not for merging
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msvc-asan:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [Win32, x64]
        asan: [on, off]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run CMake
        run: |
          $extra = if ("${{ matrix.asan }}" -eq "on") { "/fsanitize=address /Zi" } else { "/Zi" }
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }} -DJSON_BuildTests=On -DCMAKE_CXX_FLAGS="/W4 $extra"
        shell: pwsh
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target test-json_view_cpp11 test-json_view_builder_cpp11 test-json_view_builder_portable_cpp11 test-json_view_edit_cpp11
      - name: Test
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvc = (Get-ChildItem "$vs\VC\Tools\MSVC" | Sort-Object Name | Select-Object -Last 1).FullName
          $bin = if ("${{ matrix.architecture }}" -eq "x64") { "$msvc\bin\Hostx64\x64" } else { "$msvc\bin\Hostx64\x86" }
          $env:PATH = "$bin;$env:PATH"
          $env:ASAN_OPTIONS = "halt_on_error=1"
          $failed = 0
          foreach ($t in @("test-json_view_builder_portable_cpp11", "test-json_view_builder_cpp11", "test-json_view_cpp11", "test-json_view_edit_cpp11")) {
            Write-Host "=== $t"
            Push-Location build\tests
            & ".\Release\$t.exe" --no-colors=true
            if ($LASTEXITCODE -ne 0) { $failed = 1; Write-Host "=== $t FAILED with $LASTEXITCODE" }
            Pop-Location
          }
          exit $failed
        shell: pwsh
